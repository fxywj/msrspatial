[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msrspatial"
version = "0.1.0"
description = "Spatial association of brain maps under a Moran spectral null"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "SC-FC Project" }]
keywords = ["neuroscience", "spatial-omics", "transcriptomics", "null-model", "connectomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
]

[project.optional-dependencies]
enrich = ["gseapy>=1.0"]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "pytest-cov>=4", "build>=1.0", "twine>=5"]

[project.scripts]
msrspatial = "msrspatial.cli:main"

[project.urls]
Homepage = "https://github.com/fxywj/msrspatial"
Documentation = "https://github.com/fxywj/msrspatial#readme"
Source = "https://github.com/fxywj/msrspatial"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msrspatial = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
